<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#181122">
  <title>Mighty Picker</title>
  <link rel="stylesheet" href="./game-launcher.css">
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand-mark" aria-label="Mighty Picker">📦</div>
      <nav class="side-nav" aria-label="Main navigation">
      </nav>
    </aside>

    <section class="content">
      <header class="topbar">
        <label class="search"><input id="search" type="search" placeholder="Search for games" aria-label="Search for games"></label>
        <div id="controller-status" class="connection">Controller not detected</div>
      </header>

      <div class="filter-strip">
        <nav id="filters" class="filter-strip" aria-label="Filter games"></nav>
        <div class="filter-controls">
          <button id="advanced-filter-button" class="control-button" type="button">Advanced filters</button>
          <button id="sort-button" class="control-button" type="button">Sort: catalog</button>
        </div>
      </div>

      <div class="content-layout">
        <section>
          <div class="heading"><h1>All games</h1><p id="game-count"></p></div>
          <div id="game-grid" class="game-grid" aria-label="All games"></div>
        </section>

        <aside id="detail" class="detail" aria-live="polite">
          <div id="detail-art" class="detail-art"></div>
          <div class="detail-body">
            <div>
              <h2 id="detail-title">Loading games</h2>
              <p id="detail-description">Choose a game from the library to see its details.</p>
              <hr class="detail-rule">
              <div id="detail-tags" class="detail-tags"></div>
            </div>
            <button id="launch" class="launch-button" type="button" disabled>Launch on Steam</button>
          </div>
        </aside>
      </div>

      <p id="status" class="status" role="status"></p>
      <p id="catalog-fallback" class="fallback" hidden>
        Opened directly from disk? Choose <strong>pack-games.json</strong> to continue.
        <input id="catalog-file" type="file" accept="application/json,.json">
      </p>
    </section>
  </main>

  <div id="source-modal" class="modal-backdrop" role="presentation" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="source-modal-title">
      <div class="modal-header">
        <h2 id="source-modal-title">Choose a pack</h2>
        <button id="source-modal-close" class="modal-close" type="button" aria-label="Close">×</button>
      </div>
      <p id="source-modal-description"></p>
      <div id="source-list" class="source-list"></div>
    </section>
  </div>

  <div id="advanced-modal" class="modal-backdrop" role="presentation" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="advanced-modal-title">
      <div class="modal-header">
        <h2 id="advanced-modal-title">Advanced filters</h2>
        <button id="advanced-modal-close" class="modal-close" type="button" aria-label="Close">×</button>
      </div>
      <div id="advanced-fields" class="advanced-fields"></div>
      <div class="modal-actions">
        <button id="advanced-clear" class="control-button" type="button">Clear</button>
        <button id="advanced-apply" class="launch-button" type="button">Apply filters</button>
      </div>
    </section>
  </div>

  <script src="./game-launcher.js"></script>
</body>
</html>
