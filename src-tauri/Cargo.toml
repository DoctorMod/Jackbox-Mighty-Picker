[package]
name = "mighty-picker"
version = "1.0.0"
description = "Jackbox game library and Steam launcher"
authors = ["david"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mighty_picker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
